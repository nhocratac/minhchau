<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Album kỷ niệm · Minh Châu</title>
  <meta name="robots" content="noindex">
  <!-- Không gửi Referer: Google chặn (lỗi 429) ảnh Drive bị nhúng từ trang khác -->
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#BFDDF0">

<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,500&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/memories.css">
</head>
<body class="is-locked">

  <!-- ===== SVG dùng chung ===== -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="g-lily" cx="0" cy="0" r="100" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#FFFFFF"/>
        <stop offset=".32" stop-color="#E4F1FA"/>
        <stop offset=".7" stop-color="#8CBDE1"/>
        <stop offset="1" stop-color="#4F86B8"/>
      </radialGradient>
    </defs>

    <symbol id="i-lily" viewBox="-100 -100 200 200">
      <g fill="url(#g-lily)" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="1">
        <path d="M0 0C18-26 28-64 0-98C-28-64-18-26 0 0Z"/>
        <path d="M0 0C18-26 28-64 0-98C-28-64-18-26 0 0Z" transform="rotate(120)"/>
        <path d="M0 0C18-26 28-64 0-98C-28-64-18-26 0 0Z" transform="rotate(240)"/>
        <path d="M0 0C15-22 24-56 0-86C-24-56-15-22 0 0Z" transform="rotate(60)"/>
        <path d="M0 0C15-22 24-56 0-86C-24-56-15-22 0 0Z" transform="rotate(180)"/>
        <path d="M0 0C15-22 24-56 0-86C-24-56-15-22 0 0Z" transform="rotate(300)"/>
      </g>
      <g stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1.2" fill="none">
        <path d="M0-8V-78"/><path d="M0-8V-78" transform="rotate(120)"/><path d="M0-8V-78" transform="rotate(240)"/>
      </g>
      <g stroke="#F3E6C4" stroke-width="1.4" fill="#E9CF8E">
        <path d="M0 0Q6-20 10-34" fill="none"/><ellipse cx="10" cy="-36" rx="2.4" ry="4.2"/>
        <path d="M0 0Q-8-18-14-30" fill="none"/><ellipse cx="-14" cy="-32" rx="2.4" ry="4.2"/>
        <path d="M0 0Q18-8 30-12" fill="none"/><ellipse cx="32" cy="-12" rx="4.2" ry="2.4"/>
        <path d="M0 0Q-16 6-28 4" fill="none"/><ellipse cx="-30" cy="4" rx="4.2" ry="2.4"/>
      </g>
    </symbol>

    <symbol id="i-cap-line" viewBox="0 0 120 84">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
        <path d="M60 8 112 28 60 48 8 28Z" fill="currentColor" fill-opacity=".08"/>
        <path d="M30 38v18c0 9 60 9 60 0V38"/>
        <path d="M60 28c14 1 30 2 40 5v26"/>
        <path d="M96 59h8l-1.5 13h-5Z" fill="currentColor" fill-opacity=".2"/>
        <path d="M98 66v8M100 66v9M102 66v8"/>
      </g>
    </symbol>

    <symbol id="i-sparkle" viewBox="0 0 20 20">
      <path d="M10 0c1 6 4 9 10 10-6 1-9 4-10 10C9 14 6 11 0 10 6 9 9 6 10 0Z"/>
    </symbol>
  </svg>

  <!-- 1) MÀN NHẬP MẬT KHẨU -->
  <section class="mem-intro" id="gate" aria-label="Album kỷ niệm">
    <div class="mem-intro__stars" id="stars" aria-hidden="true"></div>
    <div class="mem-intro__content">
      <svg class="mem-intro__cap" aria-hidden="true"><use href="#i-cap-line"/></svg>
      <h1 class="mem-intro__script" id="albumTitle"></h1>
      <p class="mem-intro__line" id="hint"></p>
    </div>
    <form class="mem-intro__action mem-pass" id="form" autocomplete="off" novalidate onsubmit="return false">
      <label class="mem-pass__label" for="pw" id="pwLabel">Mật khẩu</label>
      <input class="mem-pass__input" id="pw" type="password" autocomplete="current-password" required>
      <button class="mem-cta" id="submit" type="submit">
        <svg class="mem-cta__spark" aria-hidden="true"><use href="#i-sparkle"/></svg>
        <span id="submitText"></span>
      </button>
      <p class="mem-intro__status" id="status" role="alert" hidden></p>
    </form>
  </section>

  <!-- 2) LƯỚI ẢNH (chỉ có ảnh sau khi mở khoá) -->
  <main class="site mem-page" id="site" hidden>
    <div class="bg-flowers" aria-hidden="true">
      <svg class="lily lily--a"><use href="#i-lily"/></svg>
      <svg class="lily lily--b"><use href="#i-lily"/></svg>
      <svg class="lily lily--c"><use href="#i-lily"/></svg>
    </div>
    <section class="mem-section" aria-label="Album ảnh">
      <h2 class="mem-card__name mem-album__title" id="pageTitle"></h2>
      <div class="mem-album__sections" id="sections"></div>
      <p class="mem-empty" id="noPhotos" hidden></p>
    </section>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/memories-core.js"></script>
  <script src="assets/js/album.js"></script>
</body>
</html>
