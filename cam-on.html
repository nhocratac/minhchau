<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Cảm ơn bạn · Lễ Tốt Nghiệp Minh Châu</title>
  <meta name="description" content="Cảm ơn bạn đã đến chung vui ngày tốt nghiệp của Châu. Chạm để cùng nhìn lại khoảnh khắc của chúng mình 💙">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#BFDDF0">

  <!-- Ảnh & tiêu đề khi chia sẻ link qua Zalo / Facebook / Messenger (sửa trực tiếp ở đây, không qua config.js) -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Cảm ơn bạn · Lễ Tốt Nghiệp Minh Châu">
  <meta property="og:description" content="Cảm ơn bạn đã đến chung vui ngày tốt nghiệp của Châu. Chạm để cùng nhìn lại khoảnh khắc của chúng mình 💙">
  <meta property="og:image" content="https://nhocratac.github.io/minhchau/assets/img/og-cover.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;0,900;1,500&display=swap">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/memories.css">
</head>
<body class="is-locked">

  <!-- ===== SVG dùng chung ===== -->
  <svg class="svg-defs" aria-hidden="true" focusable="false">
    <defs>
      <radialGradient id="g-lily" cx="0" cy="0" r="100" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#FFFFFF"/>
        <stop offset=".32" stop-color="#E4F1FA"/>
        <stop offset=".7" stop-color="#8CBDE1"/>
        <stop offset="1" stop-color="#4F86B8"/>
      </radialGradient>
    </defs>

    <symbol id="i-lily" viewBox="-100 -100 200 200">
      <g fill="url(#g-lily)" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="1">
        <path d="M0 0C18-26 28-64 0-98C-28-64-18-26 0 0Z"/>
        <path d="M0 0C18-26 28-64 0-98C-28-64-18-26 0 0Z" transform="rotate(120)"/>
        <path d="M0 0C18-26 28-64 0-98C-28-64-18-26 0 0Z" transform="rotate(240)"/>
        <path d="M0 0C15-22 24-56 0-86C-24-56-15-22 0 0Z" transform="rotate(60)"/>
        <path d="M0 0C15-22 24-56 0-86C-24-56-15-22 0 0Z" transform="rotate(180)"/>
        <path d="M0 0C15-22 24-56 0-86C-24-56-15-22 0 0Z" transform="rotate(300)"/>
      </g>
      <g stroke="#FFFFFF" stroke-opacity=".7" stroke-width="1.2" fill="none">
        <path d="M0-8V-78"/><path d="M0-8V-78" transform="rotate(120)"/><path d="M0-8V-78" transform="rotate(240)"/>
      </g>
      <g stroke="#F3E6C4" stroke-width="1.4" fill="#E9CF8E">
        <path d="M0 0Q6-20 10-34" fill="none"/><ellipse cx="10" cy="-36" rx="2.4" ry="4.2"/>
        <path d="M0 0Q-8-18-14-30" fill="none"/><ellipse cx="-14" cy="-32" rx="2.4" ry="4.2"/>
        <path d="M0 0Q18-8 30-12" fill="none"/><ellipse cx="32" cy="-12" rx="4.2" ry="2.4"/>
        <path d="M0 0Q-16 6-28 4" fill="none"/><ellipse cx="-30" cy="4" rx="4.2" ry="2.4"/>
      </g>
    </symbol>

    <symbol id="i-cap-line" viewBox="0 0 120 84">
      <g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
        <path d="M60 8 112 28 60 48 8 28Z" fill="currentColor" fill-opacity=".08"/>
        <path d="M30 38v18c0 9 60 9 60 0V38"/>
        <path d="M60 28c14 1 30 2 40 5v26"/>
        <path d="M96 59h8l-1.5 13h-5Z" fill="currentColor" fill-opacity=".2"/>
        <path d="M98 66v8M100 66v9M102 66v8"/>
      </g>
    </symbol>

    <symbol id="i-sparkle" viewBox="0 0 20 20">
      <path d="M10 0c1 6 4 9 10 10-6 1-9 4-10 10C9 14 6 11 0 10 6 9 9 6 10 0Z"/>
    </symbol>
  </svg>

  <!-- =================================================================
       1) MÀN MỞ ĐẦU — lời chào riêng cho từng khách
       ================================================================= -->
  <section class="mem-intro" id="intro" aria-label="Thư cảm ơn">
    <div class="mem-intro__stars" id="stars" aria-hidden="true"></div>

    <div class="mem-intro__content">
      <p class="mem-intro__eyebrow" id="eyebrow">Thư cảm ơn</p>
      <svg class="mem-intro__cap" aria-hidden="true"><use href="#i-cap-line"/></svg>
      <p class="mem-intro__script" id="introTitle" aria-hidden="true">Thank you</p>
      <p class="mem-intro__line" id="line1"></p>
      <p class="mem-intro__line mem-intro__line--2" id="line2" hidden></p>
    </div>

    <div class="mem-intro__action" aria-live="polite">
      <span class="mem-dots" id="loading" role="status" aria-label="Đang tải">
        <span></span><span></span><span></span>
      </span>
      <button class="mem-cta" id="cta" type="button" hidden>
        <svg class="mem-cta__spark" aria-hidden="true"><use href="#i-sparkle"/></svg>
        <span id="ctaText"></span>
      </button>
      <p class="mem-intro__status" id="status" hidden></p>
    </div>
  </section>

  <div class="flash" id="flash" aria-hidden="true"></div>

  <!-- =================================================================
       2) NỘI DUNG — lời nhắn của Châu và ảnh chụp cùng khách
       ================================================================= -->
  <main class="site mem-page" id="site" hidden>
    <div class="bg-flowers" aria-hidden="true">
      <svg class="lily lily--a"><use href="#i-lily"/></svg>
      <svg class="lily lily--b"><use href="#i-lily"/></svg>
      <svg class="lily lily--c"><use href="#i-lily"/></svg>
    </div>

    <section class="mem-section" aria-label="Lời cảm ơn">
      <article class="mem-card" id="card">
        <svg class="mem-card__spark mem-card__spark--l" aria-hidden="true"><use href="#i-sparkle"/></svg>
        <svg class="mem-card__spark mem-card__spark--r" aria-hidden="true"><use href="#i-sparkle"/></svg>
        <p class="mem-card__eyebrow" id="cardEyebrow">Thư cảm ơn</p>
        <h1 class="mem-card__name" id="guestName"></h1>
        <p class="mem-card__msg" id="message"></p>
        <span class="mem-card__rule" aria-hidden="true"></span>
        <p class="mem-card__closing" id="closing"></p>
        <p class="mem-card__sign" id="sign"></p>
      </article>

      <div class="mem-divider" aria-hidden="true">
        <svg><use href="#i-sparkle"/></svg>
      </div>

      <div class="mem-grid" id="grid"></div>
      <p class="mem-empty" id="noPhotos" hidden></p>
    </section>
  </main>

  <!-- Nút nhạc -->
  <button class="music" id="musicBtn" type="button" aria-label="Tắt nhạc" aria-pressed="true" hidden>
    <svg class="music__disc" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="24" r="22" fill="#1F3B57"/>
      <circle cx="24" cy="24" r="17" fill="none" stroke="#FFFFFF" stroke-opacity=".14"/>
      <circle cx="24" cy="24" r="13" fill="none" stroke="#FFFFFF" stroke-opacity=".14"/>
      <path d="M10 18a15 15 0 0 1 8-8" fill="none" stroke="#FFFFFF" stroke-opacity=".45" stroke-width="2" stroke-linecap="round"/>
      <circle cx="24" cy="24" r="8" fill="#BFDDF0"/>
      <circle cx="24" cy="24" r="2" fill="#1F3B57"/>
    </svg>
    <span class="music__off" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M5 5l14 14" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
    </span>
  </button>
  <audio id="bgm" loop preload="auto"></audio>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/memories-core.js"></script>
  <script src="assets/js/thanks.js"></script>
</body>
</html>
